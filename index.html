<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Plan &amp; Permit Pipeline</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka+One&family=Nunito:wght@400;600;700;800&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style>
:root{
  --ground:#F4EFDF; --surface:#FFFCF3; --surface-2:#FAF4E4; --sunk:#EAE2CC; --zebra:#FDFBF2;
  --ink:#3D2015; --ink-2:#6B4A3C; --ink-mut:#8A6B5A; --line:#E0D5BA; --line-strong:#CDBE9C;
  --green:#189946; --green-deep:#106D38; --gold:#FDB636; --gold-soft:#FFE9BE;
  --orange:#E27A25; --red:#B23A1E; --hold:#8C8577;
  --c-done:#DCF0E1; --c-active:#FFF0CE; --c-action:#FBE0CC; --c-none:transparent; --c-hold:#E6E3DC;
  --t-done:#0E6B34; --t-active:#8A5A05; --t-action:#9E4A11; --t-none:#8A6B5A; --t-hold:#6B655B;
  --c-na:#EDE6D4; --t-na:#7A6450;
  --late:#B23A1E; --soon:#9E6A0A;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --ground:#171009; --surface:#221810; --surface-2:#2B1F15; --sunk:#120C07; --zebra:#1E1610;
    --ink:#F2EADA; --ink-2:#D6C7B0; --ink-mut:#A08D78; --line:#3A2A1C; --line-strong:#4E3927;
    --green:#35B863; --green-deep:#1F8E4C;
    --c-done:#16371F; --c-active:#3D2C0C; --c-action:#3F2210; --c-none:transparent; --c-hold:#2A2620;
    --t-done:#8FE3AA; --t-active:#F3C169; --t-action:#F0A878; --t-none:#A08D78; --t-hold:#B5AC9C;
    --c-na:#2E2418; --t-na:#B09A82;
    --late:#F09076; --soon:#F3C169;
  }
}
:root[data-theme="dark"]{
  --ground:#171009; --surface:#221810; --surface-2:#2B1F15; --sunk:#120C07; --zebra:#1E1610;
  --ink:#F2EADA; --ink-2:#D6C7B0; --ink-mut:#A08D78; --line:#3A2A1C; --line-strong:#4E3927;
  --green:#35B863; --green-deep:#1F8E4C;
  --c-done:#16371F; --c-active:#3D2C0C; --c-action:#3F2210; --c-none:transparent; --c-hold:#2A2620;
  --t-done:#8FE3AA; --t-active:#F3C169; --t-action:#F0A878; --t-none:#A08D78; --t-hold:#B5AC9C;
  --c-na:#2E2418; --t-na:#B09A82;
  --late:#F09076; --soon:#F3C169;
}
*{box-sizing:border-box}
body{margin:0;background:var(--ground);color:var(--ink);font-family:'Nunito',system-ui,sans-serif;font-size:14px;-webkit-font-smoothing:antialiased}
button,select,input,textarea{font:inherit;color:inherit}
h1{margin:0;font-family:'Fredoka One','Nunito',cursive;font-weight:400}
:focus-visible{outline:2px solid var(--gold);outline-offset:-2px}

/* ---------- masthead ---------- */
.mast{background:var(--green-deep);color:#FAF6E8;border-bottom:3px solid var(--gold)}
.mast-in{padding:10px 16px;display:flex;align-items:center;gap:18px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:13px;min-width:0}
.brand img{height:28px;width:auto;display:block}
.brand .rule{width:1px;height:28px;background:rgba(250,246,232,.3)}
.brand h1{font-size:16px;color:#FAF6E8;line-height:1.15}
.brand .sub{font-size:9.5px;letter-spacing:.14em;text-transform:uppercase;color:#B9E6C6;margin-top:2px}
.counters{display:flex;gap:7px;margin-left:auto;flex-wrap:wrap}
.ct{display:flex;align-items:baseline;gap:6px;background:rgba(0,0,0,.18);border:1px solid rgba(250,246,232,.16);
  padding:4px 10px;border-radius:99px;cursor:pointer;color:#FAF6E8}
.ct:hover:not(:disabled){background:rgba(0,0,0,.32)}
.ct:disabled{opacity:.4;cursor:default}
.ct[aria-pressed="true"]{background:var(--gold);border-color:var(--gold);color:#3D2015}
.ct b{font-family:'IBM Plex Mono',monospace;font-size:14px;font-weight:600;font-variant-numeric:tabular-nums}
.ct span{font-size:9.5px;letter-spacing:.09em;text-transform:uppercase;font-weight:700}
.ct .dot{width:6px;height:6px;border-radius:50%;align-self:center}

/* ---------- toolbar ---------- */
.tools{background:var(--surface-2);border-bottom:1px solid var(--line-strong);
  padding:8px 16px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.tools .field{display:flex;align-items:center;gap:5px}
.tools label{font-size:9.5px;letter-spacing:.09em;text-transform:uppercase;color:var(--ink-mut);font-weight:800}
.tools select,.tools input{background:var(--surface);border:1px solid var(--line-strong);border-radius:6px;
  padding:5px 8px;font-size:13px}
#q{min-width:210px}
.btn{background:var(--green);color:#fff;border:0;border-radius:7px;padding:6px 12px;font-weight:800;font-size:12.5px;cursor:pointer}
.btn:hover{background:var(--green-deep)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.ghost{background:transparent;color:var(--ink-2);border:1px solid var(--line-strong);font-weight:700}
.btn.ghost:hover:not(:disabled){background:var(--sunk);color:var(--ink)}
.spacer{margin-left:auto}

/* ---------- notice ---------- */
.notice{padding:9px 16px;background:var(--gold-soft);border-bottom:1px solid var(--gold);
  font-size:12.5px;color:#6B4A0A;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]) .notice{background:#3B2A0C;color:#FFDFA6}}
:root[data-theme="dark"] .notice{background:#3B2A0C;color:#FFDFA6}

/* ---------- the grid ---------- */
.gridwrap{overflow:auto;max-height:calc(100vh - 96px)}
table{border-collapse:separate;border-spacing:0;font-size:12.5px;background:var(--surface);table-layout:fixed}
td.proj .cell,td.proj{overflow:hidden}
th,td{border-right:1px solid var(--line);border-bottom:1px solid var(--line);padding:0;vertical-align:middle}
thead th{position:sticky;top:0;z-index:3;background:var(--surface-2);color:var(--ink-2);
  font-size:9.5px;letter-spacing:.06em;text-transform:uppercase;font-weight:800;text-align:left;
  padding:7px 8px;line-height:1.25;cursor:pointer;border-bottom:2px solid var(--line-strong);
  white-space:normal;vertical-align:bottom}
thead th:hover{color:var(--ink);background:var(--sunk)}
thead th.act{cursor:default}
/* the one frozen column — a second sticky column compounds its offset, so the
   row number lives inside this cell rather than in a column of its own */
th.proj,td.proj{position:sticky;left:0;z-index:2;background:var(--surface);
  border-right:2px solid var(--line-strong)}
thead th.proj{z-index:4;background:var(--surface-2);padding-left:32px}
tbody tr:nth-child(even) td{background:var(--zebra)}
tbody tr:nth-child(even) td.proj{background:var(--zebra)}
tbody tr:hover td{background:var(--sunk)}
tbody tr:hover td.proj{background:var(--sunk)}
/* no position here — it would override the sticky rule above at equal specificity
   and unfreeze the column; sticky already establishes the containing block */
td.proj{font-weight:800}
td.proj::before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--hc,transparent)}
.rn{position:absolute;left:7px;top:8px;font-family:'IBM Plex Mono',monospace;font-size:10px;
  color:var(--ink-mut);font-variant-numeric:tabular-nums;font-weight:500}
td.proj .cell{padding-left:32px}
.flag{padding-left:32px}

/* cell editors — look like spreadsheet cells until touched */
.cell{width:100%;border:0;background:transparent;padding:6px 8px;font-size:12.5px;border-radius:0;
  display:block;min-width:0}
.cell:hover{box-shadow:inset 0 0 0 1px var(--line-strong)}
.cell:focus{outline:0;box-shadow:inset 0 0 0 2px var(--green);background:var(--surface)}
select.cell{cursor:pointer;appearance:none;-webkit-appearance:none;font-weight:700;
  background-image:none;padding-right:8px}
input.cell[type=date]{font-family:'IBM Plex Mono',monospace;font-size:11.5px;font-variant-numeric:tabular-nums}
button.cell.dstub{text-align:left;cursor:pointer;font-family:'IBM Plex Mono',monospace;font-size:11.5px;
  color:var(--ink-mut);opacity:.4}
button.cell.dstub:hover,button.cell.dstub:focus-visible{opacity:1}
button.cell.dstub.na{opacity:.85;font-weight:600;letter-spacing:.04em}
td.proj .cell{font-weight:800}
textarea.cell{resize:vertical;min-height:32px;line-height:1.35;font-size:12px;color:var(--ink-2)}
/* conditional fills, mirroring the sheet's status colors */
td.st-done select{background:var(--c-done);color:var(--t-done)}
td.st-active select{background:var(--c-active);color:var(--t-active)}
td.st-action select{background:var(--c-action);color:var(--t-action)}
td.st-none select{background:var(--c-none);color:var(--t-none);font-weight:400}
td.st-hold select{background:var(--c-hold);color:var(--t-hold)}
td.st-na select{background:var(--c-na);color:var(--t-na);font-weight:600}
td.d-late input{color:var(--late);font-weight:600}
td.d-soon input{color:var(--soon);font-weight:600}
/* drag handle lives in the frozen project cell */
.rn{padding:2px 3px;border-radius:3px;touch-action:none}
.rn.grab{cursor:grab}
.rn.grab:hover{background:var(--line-strong);color:var(--ink)}
.rn.grab:active{cursor:grabbing}
.rn.locked{cursor:default}
.rn.locked:hover{background:none;color:var(--ink-mut)}
tr.dragging td{opacity:.4}
tr.dropbefore td{box-shadow:inset 0 2px 0 0 var(--green)}
tr.dropafter td{box-shadow:inset 0 -2px 0 0 var(--green)}

/* per-cell comment marker — the cell must be the positioning context,
   or every marker stacks against the page instead of its own cell */
tbody td{position:relative}
.cmark{position:absolute;top:0;right:0;width:13px;height:13px;padding:0;border:0;border-radius:0 0 0 4px;
  background:transparent;color:var(--ink-mut);font-family:'IBM Plex Mono',monospace;font-size:8.5px;
  font-weight:600;line-height:13px;text-align:center;cursor:pointer;opacity:0;z-index:2}
td:hover .cmark{opacity:.5}
.cmark.has{opacity:1;background:var(--gold);color:#3D2015}
.cmark:hover,.cmark:focus-visible{opacity:1;background:var(--green);color:#fff}
.cmark.has::after{content:""}

/* comment popover */
.pop{position:fixed;z-index:70;width:320px;max-width:calc(100vw - 24px);background:var(--surface);
  border:1px solid var(--line-strong);border-radius:10px;box-shadow:0 12px 34px -12px rgba(0,0,0,.45);
  display:flex;flex-direction:column;max-height:min(420px,70vh)}
.pop header{padding:9px 12px;border-bottom:1px solid var(--line);background:var(--surface-2);
  border-radius:10px 10px 0 0;display:flex;align-items:baseline;gap:8px}
.pop header b{font-size:12.5px;font-weight:800}
.pop header span{font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-mut);font-weight:700}
.pop header button{margin-left:auto;background:none;border:0;cursor:pointer;color:var(--ink-mut);font-size:14px;line-height:1;padding:2px 4px}
.pop header button:hover{color:var(--ink)}
.pop .thread{overflow-y:auto;padding:4px 0;flex:1;min-height:0}
.pop .none{padding:16px 12px;text-align:center;color:var(--ink-mut);font-size:12px}
.cmt{padding:8px 12px;border-bottom:1px solid var(--line);font-size:12.5px;line-height:1.45}
.cmt:last-child{border-bottom:0}
.cmt .who{display:flex;align-items:center;gap:6px;margin-bottom:3px}
.cmt .who img{width:16px;height:16px;border-radius:50%;flex:none}
.cmt .who b{font-size:11.5px;font-weight:800}
.cmt .who time{font-family:'IBM Plex Mono',monospace;font-size:10px;color:var(--ink-mut)}
.cmt .who button{margin-left:auto;background:none;border:0;color:var(--ink-mut);cursor:pointer;
  font-size:11px;padding:1px 4px;border-radius:4px;opacity:0}
.cmt:hover .who button{opacity:1}
.cmt .who button:hover{background:var(--red);color:#fff}
.cmt p{margin:0;white-space:pre-wrap;word-break:break-word;color:var(--ink-2)}
.pop form{border-top:1px solid var(--line);padding:9px 10px;display:flex;flex-direction:column;gap:7px}
.pop textarea{width:100%;min-height:56px;resize:vertical;font-size:12.5px;line-height:1.4;
  background:var(--surface);border:1px solid var(--line-strong);border-radius:7px;padding:7px 9px}
.pop .frow{display:flex;align-items:center;gap:8px}
.pop .frow .hint{font-size:10.5px;color:var(--ink-mut)}
td.act{text-align:center;border-right:0;white-space:nowrap;padding:0 2px}
.act button{background:none;border:0;color:var(--ink-mut);cursor:pointer;padding:4px 5px;border-radius:5px;
  font-size:13px;line-height:1}
.arch:hover{background:var(--green);color:#fff}
.del:hover{background:var(--red);color:#fff}
.del[data-armed="1"]{background:var(--red);color:#fff}
tr.isarch td{opacity:.66}
tr.isarch td.proj{font-style:italic}
/* view switch */
.seg{display:flex;background:var(--sunk);border:1px solid var(--line-strong);border-radius:7px;padding:2px;gap:2px}
.seg button{background:none;border:0;padding:4px 11px;border-radius:5px;cursor:pointer;font-size:12px;
  font-weight:700;color:var(--ink-mut);white-space:nowrap}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(61,32,21,.14)}
.seg button b{font-family:'IBM Plex Mono',monospace;font-weight:600;font-size:11px;opacity:.75;margin-left:4px}
.flag{font-family:'IBM Plex Mono',monospace;font-size:9.5px;font-weight:600;color:var(--late);
  padding:0 8px 5px;display:block;margin-top:-3px}
tfoot td{padding:8px;border-bottom:0;background:var(--surface-2)}
.empty{padding:36px 16px 44px;text-align:center;color:var(--ink-mut);font-size:13px}
.empty h2{margin:0 0 4px;font-size:15px;font-family:'Nunito';font-weight:800;color:var(--ink)}
.empty .chips{display:flex;gap:6px;justify-content:center;flex-wrap:wrap;margin:14px 0 16px}
.empty .chip{display:inline-flex;align-items:center;gap:6px;background:var(--surface-2);
  border:1px solid var(--line-strong);border-radius:99px;padding:4px 6px 4px 11px;font-size:12px;color:var(--ink-2)}
.empty .chip b{font-weight:800;color:var(--ink)}
.empty .chip button{background:none;border:0;cursor:pointer;color:var(--ink-mut);font-size:13px;
  line-height:1;padding:2px 5px;border-radius:50%}
.empty .chip button:hover{background:var(--red);color:#fff}
.empty .acts{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

<header class="mast">
  <div class="mast-in">
    <div class="brand">
      <img id="wm" alt="Cheba Hut Toasted Subs">
      <div class="rule"></div>
      <div>
        <h1>Plan &amp; Permit Pipeline</h1>
        <div class="sub">Design &amp; Construction · Store Development</div>
      </div>
    </div>
    <div class="counters" id="counters"></div>
  </div>
</header>

<div class="tools">
  <input type="text" id="q" placeholder="Search project, architect, notes…" aria-label="Search">
  <div class="field"><label for="fArch">Architect</label><select id="fArch"></select></div>
  <div class="field"><label for="fEng">Engineer</label><select id="fEng"></select></div>
  <div class="field"><label for="fPkg">Package</label><select id="fPkg"></select></div>
  <button class="btn ghost" id="clear" hidden>Clear filters</button>
  <span class="spacer"></span>
  <div class="seg" role="group" aria-label="Which projects to show">
    <button id="vActive" aria-pressed="true">Active<b id="nActive"></b></button>
    <button id="vArch" aria-pressed="false">Archived<b id="nArch"></b></button>
    <button id="vAll" aria-pressed="false">All</button>
  </div>
  <button class="btn ghost" id="sweep" hidden>Archive completed</button>
  <button class="btn" id="add">+ Row</button>
  <button class="btn ghost" id="csv">Export CSV</button>
</div>

<div id="notice" class="notice" hidden><span>⚠</span><span id="noticeTxt"></span></div>
<div class="gridwrap"><div id="grid"></div></div>

var ACTION={'HQ Comments Returned':1,'Comments':1,'Resubmittal':1};
function kind(st,stage){
  if(!st) return 'none';
  if(st==='On Hold') return 'hold';
  if(stage.done.indexOf(st)>-1) return 'done';
  if(ACTION[st]) return 'action';
  if(ACTIVE[st]) return 'active';
  return 'none';
}
var TODAY=(function(){var d=new Date();d.setHours(0,0,0,0);return d;})();
function parseD(s){ if(!/^\d{4}-\d{2}-\d{2}$/.test(s||'')) return null;
  var p=s.split('-'); return new Date(+p[0],+p[1]-1,+p[2]); }
function days(s){ var d=parseD(s); return d===null?null:Math.round((d-TODAY)/86400000); }

/* which stage the project is sitting in, and the date it's waiting on */
function current(p){
  if(p.floorplanStatus==='On Hold') return {hold:true,i:-1,stage:null};
  for(var i=0;i<STAGES.length;i++){
    if(STAGES[i].done.indexOf(p[STAGES[i].s]||'')===-1) return {hold:false,i:i,stage:STAGES[i]};
  }
  return {hold:false,i:5,stage:null};
}
/* returns WHICH field drives this project's timing, not just its value —
   two columns can hold the same date, only one of them is the one being waited on */
function targetDate(p,c){
  if(c.hold||c.i===5) return {f:'',v:''};
  if(c.i===4){
    var st=p.permitStatus||'';
    if(st!=='Not Started'&&p.permitReceiptDate) return {f:'permitReceiptDate',v:p.permitReceiptDate};
    if(p.permitSubmissionDate) return {f:'permitSubmissionDate',v:p.permitSubmissionDate};
    if(p.permitReceiptDate) return {f:'permitReceiptDate',v:p.permitReceiptDate};
    return {f:'',v:''};
  }
  return {f:c.stage.d, v:p[c.stage.d]||''};
}
function health(p){
  var c=current(p);
  if(c.hold) return 'hold';
  if(c.i===5) return 'done';
  var n=days(targetDate(p,c).v);
  if(n===null) return 'none';
  return n<0?'late':(n<=14?'soon':'ok');
}

        '<button data-drop="'+f.k+'" title="Remove this filter">✕</button></span>';}).join('')+'</div>'+
    '<div class="acts">'+
      other.map(function(o){ return '<button class="btn" data-go="'+o.m+'">Show '+
        o.n+' in '+esc(MNAME[o.m])+'</button>';}).join('')+
      '<button class="btn ghost" data-drop="*">Clear all filters</button>'+
    '</div></div>';
}
function wireEmpty(){
  Array.prototype.forEach.call(el('grid').querySelectorAll('[data-drop]'),function(b){
    b.onclick=function(){
      if(b.dataset.drop==='*'){ filt={q:'',arch:'',eng:'',pkg:'',health:''}; el('q').value=''; }
      else { filt[b.dataset.drop]=''; if(b.dataset.drop==='q') el('q').value=''; }
      render();
    };
  });
  Array.prototype.forEach.call(el('grid').querySelectorAll('[data-go]'),function(b){
    b.onclick=function(){ mode=b.dataset.go; render(); };
  });
}


/* ── drag to reorder ────────────────────────────────────────── */
/* Rows carry a numeric `order` field and the live query sorts on it, so a move
   only has to rewrite the dragged row: its new order is the midpoint between
   its new neighbours. Renumbers everything when the gap gets too small. */
function onum(p){ var v=p&&p.order; return typeof v==='number'&&isFinite(v)?v:0; }
var dragId=null, dropOn=null, dropBefore=false;
/* Pointer events rather than HTML5 drag-and-drop: works with touch and trackpads
   and does not depend on dataTransfer behaving the same across browsers. */
function wireDrag(){
  Array.prototype.forEach.call(el('grid').querySelectorAll('.rn.grab'),function(g){
    g.addEventListener('mousedown',startDrag);
    g.addEventListener('touchstart',startDrag,{passive:false});
  });
}
function pointOf(ev){
  var t=ev.touches&&ev.touches[0];
  return {x:t?t.clientX:ev.clientX, y:t?t.clientY:ev.clientY};
}
function startDrag(ev){
  if(ev.button&&ev.button!==0) return;
  var tr=ev.currentTarget.closest('tr[data-row]'); if(!tr) return;
  ev.preventDefault();
  dragId=tr.dataset.row; dropOn=null;
  tr.classList.add('dragging');
  document.body.style.userSelect='none';
  document.addEventListener('mousemove',onDrag,true);
  document.addEventListener('mouseup',endDrag,true);
  document.addEventListener('touchmove',onDrag,{passive:false,capture:true});
  document.addEventListener('touchend',endDrag,true);
}
function onDrag(ev){
  if(!dragId) return;
  ev.preventDefault();
  var pt=pointOf(ev);
  var hit=document.elementFromPoint(pt.x,pt.y);
  var tr=hit&&hit.closest?hit.closest('tr[data-row]'):null;
  clearDrop(true);
  if(!tr||tr.dataset.row===dragId){ dropOn=null; return; }
  var r=tr.getBoundingClientRect();
  dropBefore=(pt.y-r.top)<r.height/2;
  dropOn=tr.dataset.row;
  tr.classList.add(dropBefore?'dropbefore':'dropafter');
}
function endDrag(){
  document.removeEventListener('mousemove',onDrag,true);
  document.removeEventListener('mouseup',endDrag,true);
  document.removeEventListener('touchmove',onDrag,{capture:true});
  document.removeEventListener('touchend',endDrag,true);
  document.body.style.userSelect='';
  var src=dragId, tgt=dropOn, before=dropBefore;
  dragId=null; dropOn=null;
  clearDrop();
  if(src&&tgt&&src!==tgt) moveRow(src,tgt,before);
}
function clearDrop(keepDragging){
  Array.prototype.forEach.call(el('grid').querySelectorAll('tr'),function(t){
    t.classList.remove('dropbefore','dropafter');
    if(!keepDragging) t.classList.remove('dragging'); });
}
function moveRow(srcId,tgtId,before){
  if(!live||!db){ flash('Read-only — the new order was not saved.',true); return; }
  var full=order.slice(), from=full.indexOf(srcId);
  if(from<0) return;
  full.splice(from,1);
  var ti=full.indexOf(tgtId); if(ti<0) return;
  var to=before?ti:ti+1;
  full.splice(to,0,srcId);
  var prev=to>0?byId[full[to-1]]:null, next=to<full.length-1?byId[full[to+1]]:null;
  var po=prev?onum(prev):null, no=next?onum(next):null, v;
  if(po===null&&no===null) v=0;
  else if(po===null) v=no-1;
  else if(no===null) v=po+1;
  else if(Math.abs(no-po)<1e-9){ return renumber(full); }
  else v=(po+no)/2;
  byId[srcId].order=v; order=full; keepPlace(render);
  db.doc('projects/'+srcId).update({order:v,updatedAt:Date.now()})
    .then(function(){ flash('Moved '+(byId[srcId].project||'row')+'.'); })
    .catch(function(e){ flash('Could not save the new order ('+((e&&e.code)||'error')+').',true); });
}
/* fallback when midpoints run out of room: spread everything back out */
function renumber(full){
  order=full; full.forEach(function(id,i){ if(byId[id]) byId[id].order=i; });
  keepPlace(render);
  var n=Date.now(), fails=0;
  full.forEach(function(id,i){
    db.doc('projects/'+id).update({order:i,updatedAt:n})
      .catch(function(){ if(!fails++) flash('Some rows did not keep their new order — reload to check.',true); });
  });
}

/* ── per-cell comments ──────────────────────────────────────── */
function cmark(p,c){
  var n=cthread(p.id,c.k).length;
  return '<button class="cmark'+(n?' has':'')+'" data-p="'+esc(p.id)+'" data-c="'+esc(c.k)+'"'+
    ' title="'+(n?n+' comment'+(n>1?'s':''):'Add a comment')+'" aria-label="Comments">'+(n||'·')+'</button>';
}
function closePop(){
  var e=el('pop'); if(e) e.remove();
  openCell=null;
  document.removeEventListener('mousedown',outsidePop,true);
  document.removeEventListener('keydown',escPop,true);
}
function outsidePop(ev){ var e=el('pop'); if(e&&!e.contains(ev.target)&&!/cmark/.test(ev.target.className||'')) closePop(); }
function escPop(ev){ if(ev.key==='Escape'){ ev.stopPropagation(); closePop(); } }

function openComments(pid,field,anchorEl){
  if(openCell&&openCell.pid===pid&&openCell.field===field){ closePop(); return; }
  closePop();
  openCell={pid:pid,field:field};
  var pop=document.createElement('div');
  pop.className='pop'; pop.id='pop';
  document.body.appendChild(pop);
  var r=anchorEl.getBoundingClientRect();
  var left=Math.min(Math.max(8,r.right-320), window.innerWidth-328);
  var top=r.bottom+6;
  pop.style.left=left+'px';
  pop.style.top=top+'px';
  drawPop();
  /* flip above the cell when it would hang off the bottom */
  var ph=pop.getBoundingClientRect().height;
  if(top+ph>window.innerHeight-8) pop.style.top=Math.max(8,r.top-ph-6)+'px';
  document.addEventListener('mousedown',outsidePop,true);
  document.addEventListener('keydown',escPop,true);
  var ta=pop.querySelector('textarea'); if(ta) ta.focus();
}
function colLabel(f){
  for(var i=0;i<COLS.length;i++) if(COLS[i].k===f) return COLS[i].t;
  return f;
}
function drawPop(){
  var pop=el('pop'); if(!pop||!openCell) return;
  var pid=openCell.pid, field=openCell.field;
  var p=byId[pid]||{}, items=cthread(pid,field);
  var draft=pop.querySelector('textarea'), keep=draft?draft.value:'';
  var ids={}; items.forEach(function(c){ if(c.by) ids[c.by]=1; });
  var body=items.map(function(c){
    var pr=profs[c.by]||{}, nm=pr.name||'Someone', mine=c.by&&c.by===meId;
    return '<div class="cmt"><div class="who">'+
      (pr.avatarUrl?'<img src="'+esc(pr.avatarUrl)+'" alt="">':'')+
      '<b>'+esc(mine?(nm==='Someone'?'You':nm):nm)+'</b>'+
      '<time>'+esc(when(c.at))+'</time>'+
      (live?'<button data-del="'+esc(c.id)+'" title="Delete this comment">✕</button>':'')+
      '</div><p></p></div>';
  }).join('');
  pop.innerHTML='<header><b>'+esc(p.project||'Untitled')+'</b><span>'+esc(colLabel(field))+'</span>'+
      '<button id="popx" title="Close" aria-label="Close">✕</button></header>'+
    '<div class="thread">'+(items.length?body:'<div class="none">No comments on this cell yet.</div>')+'</div>'+
    (live?'<form><textarea placeholder="Add a comment…" maxlength="4000"></textarea>'+
       '<div class="frow"><button type="submit" class="btn">Comment</button>'+
       '<span class="hint">Visible to everyone with access</span></div></form>'
     :'<div class="none">Read-only — commenting needs the live connection.</div>');
  /* text set as textContent so a comment can never inject markup */
  var ps=pop.querySelectorAll('.cmt p');
  items.forEach(function(c,i){ if(ps[i]) ps[i].textContent=c.text; });
  var ta=pop.querySelector('textarea'); if(ta&&keep) ta.value=keep;
  pop.querySelector('#popx').onclick=closePop;
  var f=pop.querySelector('form');
  if(f) f.onsubmit=function(ev){ ev.preventDefault(); postComment(pid,field,ta.value); };
  if(ta) ta.addEventListener('keydown',function(ev){
    if((ev.metaKey||ev.ctrlKey)&&ev.key==='Enter'){ ev.preventDefault(); postComment(pid,field,ta.value); } });
  Array.prototype.forEach.call(pop.querySelectorAll('[data-del]'),function(b){
    b.onclick=function(){ removeComment(pid,field,b.dataset.del); }; });
  resolveNames(Object.keys(ids));
}
/* names are resolved per render and never stored — only ids live in the data */
function resolveNames(ids){
  var need=ids.filter(function(i){ return i && !profs[i]; });
  if(!need.length||!userCap||!userCap.profiles) return;
  userCap.profiles(need).then(function(map){
    var got=false;
    need.forEach(function(i){ if(map&&map[i]){ profs[i]=map[i]; got=true; } });
    if(got) drawPop();
  }).catch(function(){});
}
function postComment(pid,field,text){
  text=(text||'').trim();
  if(!text) return;
  if(!live||!db){ flash('Read-only — the comment was not saved.',true); return; }
  var k=ckey(pid,field), cur=cthread(pid,field).slice();
  cur.push({id:'c'+Date.now().toString(36)+Math.random().toString(36).slice(2,7),
            by:meId||'', text:text.slice(0,4000), at:Date.now()});
  cmts[k]={projectId:pid,field:field,items:cur};
  var ta=el('pop')&&el('pop').querySelector('textarea'); if(ta) ta.value='';
  drawPop(); render();
  db.doc('comments/'+k).set({projectId:pid,field:field,items:cur,updatedAt:Date.now()})
    .catch(function(e){ flash('The comment did not save ('+((e&&e.code)||'error')+').',true); });
}
function removeComment(pid,field,cid){
  if(!live||!db) return;
  var k=ckey(pid,field), cur=cthread(pid,field).filter(function(c){ return c.id!==cid; });
  if(cur.length) cmts[k]={projectId:pid,field:field,items:cur}; else delete cmts[k];
  drawPop(); render();
  var done=cur.length
    ? db.doc('comments/'+k).set({projectId:pid,field:field,items:cur,updatedAt:Date.now()})
    : db.doc('comments/'+k).delete();
  done.catch(function(e){ flash('The comment did not delete ('+((e&&e.code)||'error')+').',true); });
}

/* ── edits ──────────────────────────────────────────────────── */
var flashT=null;
function flash(msg,bad){
  el('noticeTxt').textContent=msg; el('notice').hidden=false;
  clearTimeout(flashT);
  if(!bad) flashT=setTimeout(function(){ if(live) el('notice').hidden=true; },1400);
}
function save(id,field,value){
  var p=byId[id]; if(!p||p[field]===value) return;
  p[field]=value;
  keepPlace(render);
  if(!live||!db){ flash('Read-only — that change was not saved.',true); return; }
  var body={}; body[field]=value; body.updatedAt=Date.now();
  db.doc('projects/'+id).update(body).then(function(){ flash('Saved.'); })
   .catch(function(e){ flash('Save failed ('+((e&&e.code)||'error')+') — reload and try again.',true); });
}
function addRow(){
  if(!live||!db) return;
  var ref=db.collection('projects').doc();
  var p={project:'',architect:'',engineer:'',finishPackage:'TBD',
    siteSurvey:'Not Started',surveyDate:'',
    floorplanStatus:'Not Started',floorplanDue:'',backgroundStatus:'Not Started',backgroundDue:'',
    permitArchStatus:'Not Started',permitArchDue:'',permitMepStatus:'Not Started',permitMepDue:'',
    permitStatus:'Not Started',permitSubmissionDate:'',permitReceiptDate:'',notes:'',
    archived:false, archivedAt:0, order:Date.now()/1000, updatedAt:Date.now()};
  ref.set(p).then(function(){
    p.id=ref.id; byId[ref.id]=p; if(order.indexOf(ref.id)<0) order.push(ref.id);
    sortKey=''; if(mode==='archived') mode='active'; render();
    var f=el('grid').querySelector('[data-id="'+ref.id+'"][data-f="project"]');
    if(f){ f.scrollIntoView({block:'center'}); f.focus(); }
  }).catch(function(e){ flash('Could not add a row ('+((e&&e.code)||'error')+').',true); });
}
/* ── archive ────────────────────────────────────────────────── */
function setArchived(id,on){
  var p=byId[id]; if(!p||isArch(p)===on) return;
  p.archived=on; p.archivedAt=on?Date.now():0;
  render();
  if(!live||!db){ p.archived=!on; render();
    flash('Read-only — archiving isn’t saved right now.',true); return; }
  db.doc('projects/'+id).update({archived:on,archivedAt:p.archivedAt,updatedAt:Date.now()})
    .then(function(){ flash(on?'Archived '+(p.project||'row')+'.':'Restored '+(p.project||'row')+'.'); })
    .catch(function(e){ p.archived=!on; render();
      flash('Couldn’t archive ('+((e&&e.code)||'error')+').',true); });
}
function sweep(){
  if(!live||!db){ flash('Read-only — archiving isn’t saved right now.',true); return; }
  var todo=order.map(function(i){return byId[i];}).filter(Boolean)
    .filter(function(p){ return !isArch(p)&&complete(p); });
  if(!todo.length) return;
  var b=el('sweep');
  if(b.dataset.armed!=='1'){ b.dataset.armed='1';
    b.textContent='Archive '+todo.length+'? Click again';
    setTimeout(function(){ if(b.dataset.armed==='1'){ b.dataset.armed=''; render(); } },4000); return; }
  b.dataset.armed='';
  var n=Date.now(), done=0, failed=0;
  todo.forEach(function(p){ p.archived=true; p.archivedAt=n; });
  render();
  todo.forEach(function(p){
    db.doc('projects/'+p.id).update({archived:true,archivedAt:n,updatedAt:n})
      .then(function(){ if(++done+failed===todo.length&&!failed) flash('Archived '+done+' completed projects.'); })
      .catch(function(){ failed++; flash('Some rows didn’t archive — reload to check.',true); });
  });
}
function del(b){
  if(!live){ flash('Read-only — rows can’t be deleted.',true); return; }
  if(b.dataset.armed!=='1'){ b.dataset.armed='1'; b.title='Click again to delete';
    setTimeout(function(){ if(b){b.dataset.armed='';b.title='Delete row';} },4000); return; }
  var id=b.dataset.id;
  if(openCell&&openCell.pid===id) closePop();
  delete byId[id]; order=order.filter(function(x){return x!==id;});
  var orphans=Object.keys(cmts).filter(function(k){ return cmts[k]&&cmts[k].projectId===id; });
  orphans.forEach(function(k){ delete cmts[k]; });
  render();
  if(db){
    db.doc('projects/'+id).delete().catch(function(){ flash('Delete may not have saved — reload to check.',true); });
    orphans.forEach(function(k){ db.doc('comments/'+k).delete().catch(function(){}); });
  }
}

/* ── CSV ────────────────────────────────────────────────────── */
function toCSV(){
  var HL={late:'Overdue',soon:'Due within 14 days',hold:'On hold',done:'Permitted',ok:'On track',none:'No date set'};
  var head=COLS.map(function(c){return c.t;}).concat(['Status','Archived']);
  var lines=[head];
  rows().forEach(function(p){
    lines.push(COLS.map(function(c){return p[c.k]||'';})
      .concat([HL[health(p)]||'', isArch(p)?'Yes':'No']));
  });
  return lines.map(function(r){return r.map(function(v){
    v=String(v==null?'':v); return /[",\n]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v;}).join(',');}).join('\r\n');
}
function exportCSV(){
  var name='plan-tracking-'+new Date().toISOString().slice(0,10)+'.csv';
  useCap('downloads').then(function(d){
    if(!d){ flash('Downloads aren’t available in this view.',true); return; }
    return d.save({filename:name, data:toCSV()});
  }).catch(function(){ flash('The export was cancelled or unavailable.',true); });
}

/* ── wiring ─────────────────────────────────────────────────── */
var qt=null;
el('q').addEventListener('input',function(){ clearTimeout(qt);
  qt=setTimeout(function(){ filt.q=el('q').value; render(); },180); });
el('fArch').addEventListener('change',function(){filt.arch=this.value;render();});
el('fEng').addEventListener('change',function(){filt.eng=this.value;render();});
el('fPkg').addEventListener('change',function(){filt.pkg=this.value;render();});
el('clear').onclick=function(){ filt={q:'',arch:'',eng:'',pkg:'',health:''}; el('q').value=''; render(); };
el('add').onclick=addRow;
el('csv').onclick=exportCSV;
el('sweep').onclick=sweep;
function setMode(m){ return function(){ mode=m; el('sweep').dataset.armed=''; render(); }; }
el('vActive').onclick=setMode('active');
el('vArch').onclick=setMode('archived');

/* ── connect ────────────────────────────────────────────────── */
function useCap(name){
  try{
    if(typeof claude==='undefined'||!claude||typeof claude.use!=='function') return Promise.resolve(null);
    return Promise.resolve(claude.use(name));
  }catch(e){ return Promise.resolve(null); }
}
/* comments ride alongside the projects: one subscription, keyed <projectId>__<field> */
function watchComments(){
  if(cunsub||!db) return;
  cunsub=db.collection('comments').onSnapshot(function(snap){
    var next={};
    try{
      (snap.docs||[]).forEach(function(doc){
        var s=doc.data()||{}, v={};
        for(var k in s) v[k]=s[k];
        if(!Array.isArray(v.items)) v.items=[];
        next[doc.id]=v;
      });
    }catch(e){ return; }
    cmts=next; render(); if(openCell) drawPop();
  }, function(){ /* comments are a side channel — never break the grid over them */ });
}
function whoAmI(){
  useCap('user').then(function(u){
    if(!u) return;
    userCap=u;
    if(u.id) u.id().then(function(i){ meId=i||null; }).catch(function(){});
  });
}
function loadSnapshot(){
  var nextById={}, nextOrder=[];
  SNAPSHOT.forEach(function(r){ var v={}; for(var k in r) v[k]=r[k]; nextById[r.id]=v; nextOrder.push(r.id); });
  byId=nextById; order=nextOrder;
  render();
}
function readOnly(why){
  live=false; el('add').disabled=true;
  el('noticeTxt').innerHTML='<b>Read-only.</b> '+esc(why)+' Showing the saved snapshot from '+SNAPDATE+
    '. <button class="btn ghost" id="retry" style="margin-left:6px;padding:3px 9px">Try again</button>';
  el('notice').hidden=false;
  var r=el('retry'); if(r) r.onclick=function(){ el('noticeTxt').textContent='Reconnecting…'; connect(); };
}
var arrived=false, unsub=null;
function connect(){
  if(unsub){ try{unsub();}catch(e){} unsub=null; }
  var settled=false;
  setTimeout(function(){ if(!settled&&!arrived) readOnly('The live connection didn’t answer.'); },12000);
  useCap('db').then(function(d){
    if(!d){ settled=true; readOnly('Live saving isn’t available in this view.'); return; }
    db=d;
    unsub=db.collection('projects').orderBy('order').onSnapshot(function(snap){
      settled=true; arrived=true;
      /* Build into locals and commit only once the whole rebuild succeeds. Wiping the
         globals up front meant one bad document left the page holding nothing, while
         the already-drawn rows stayed on screen until the next render exposed it. */
      var nextById={}, nextOrder=[];
      try{
        var docs=snap.docs||[];
        for(var i=0;i<docs.length;i++){
          var doc=docs[i], src=doc.data()||{}, v={};
          /* data() comes back frozen — copy it before adding anything, or strict mode
             throws "cannot add property id" and the whole update is lost */
          for(var k in src) v[k]=src[k];
          v.id=doc.id;
          ['project','architect','engineer','finishPackage','notes','siteSurvey','surveyDate']
            .forEach(function(f){ if(v[f]==null) v[f]=''; });
          v.archived=v.archived===true;
          nextById[doc.id]=v; nextOrder.push(doc.id);
        }
      }catch(e){
        if(window.console&&console.error) console.error('snapshot rebuild failed',e);
        flash('A live update could not be read ('+((e&&e.message)||e)+'). Still showing the last good data.',true);
        return;                     /* keep whatever is already loaded */
      }
      if(!nextOrder.length){
        if(order.length) return;    /* an empty delivery never wipes good data */
        loadSnapshot(); readOnly('The live store came back empty.'); return;
      }
      byId=nextById; order=nextOrder;
      live=true; el('add').disabled=false; el('notice').hidden=true; render();
      watchComments();
    }, function(e){
      settled=true; var code=(e&&e.code)||'unknown';
      if(arrived){ live=false; el('add').disabled=true;
        el('noticeTxt').textContent='Live sync stopped ('+code+'). Reload to reconnect — changes now won’t save.';
        el('notice').hidden=false; }
      else readOnly('The live store couldn’t be read ('+code+').');
    });
  }).catch(function(e){ settled=true;
    readOnly('The live store couldn’t be reached ('+((e&&(e.code||e.message))||'unknown')+').'); });
}
loadSnapshot();
whoAmI();
connect();
})();
</script>
